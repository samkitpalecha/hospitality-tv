plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hospitality.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId "com.hospitality.tvhome"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Zero third-party dependencies!
    // Pure Android framework for maximum speed and rock-solid stability.
}
